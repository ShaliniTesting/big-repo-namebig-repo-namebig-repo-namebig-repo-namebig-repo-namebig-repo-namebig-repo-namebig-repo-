# Google Cloud Platform (GCP) Kubernetes Deployment
# This manifest defines a deployment for the Node.js Hello World application in GKE

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  labels:
    app: hello-world
    tier: backend
    environment: production
  annotations:
    description: "Node.js Hello World HTTP server"
spec:
  # Define how many replicas of the application to run
  replicas: 1
  # Define how the deployment identifies which pods to manage
  selector:
    matchLabels:
      app: hello-world
  # Define the pod template
  template:
    metadata:
      labels:
        app: hello-world
        tier: backend
        environment: production
    spec:
      containers:
        - name: hello-world
          image: gcr.io/your-project-id/hello-world:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"  # Bind to all interfaces in container
          # Define resource requirements and limits
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          # Health check to determine if container is ready to receive traffic
          readinessProbe:
            httpGet:
              path: /hello
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          # Health check to determine if container is alive
          livenessProbe:
            httpGet:
              path: /hello
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          # Security context for the container
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      # Configure the termination grace period
      terminationGracePeriodSeconds: 30