name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test:
    # Run tests to ensure the code is ready for release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          
      - name: Install dependencies
        run: cd src/backend && npm ci
        
      - name: Run linter
        run: cd src/backend && npm run lint
        
      - name: Run tests
        run: cd src/backend && npm test -- --ci --coverage

  build-and-push-image:
    # Build and push Docker image to Docker Hub
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Extract metadata for Docker
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./src/backend
          file: ./infrastructure/Dockerfile
          push: true
          tags: user/hello-world:latest,user/hello-world:${{ steps.meta.outputs.version }}

  create-release:
    # Create a GitHub release
    runs-on: ubuntu-latest
    needs: [build-and-push-image]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            Release of the Node.js Hello World application. See the [deployment documentation](./docs/deployment.md) for instructions on how to deploy this release.
          draft: false
          prerelease: false